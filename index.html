<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App & Software Hero Section</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-[#1b2148]">

  <main class="w-full">
    <section class="min-h-screen flex items-center bg-white px-6 py-16">
      <div class="max-w-[1120px] mx-auto grid lg:grid-cols-[520px_480px] items-center gap-12">

        <!-- LEFT SIDE -->
        <div class="text-center lg:text-left">
          <p class="text-[18px] font-semibold mb-6">
            Ready to Use Tailwind CSS Web Template.
          </p>

          <h1 class="text-[44px] sm:text-[52px] lg:text-[58px] font-extrabold leading-[1.1] tracking-[-1px] text-[#070b24]">
            Tailwind Template for
            <br />
            <span class="text-[#9ea4ff]">App &amp; Software</span> Site.
          </h1>

          <p class="mt-7 text-[#7f8798] text-[16px] leading-[1.8] max-w-[500px] mx-auto lg:mx-0">
            All in one Tailwind CSS site template for - App and Software
            sites Comes with all essential components.
          </p>

          <div class="mt-10 flex flex-wrap items-center justify-center lg:justify-start gap-5">

            <!-- Download button -->
            <a href="#"
              class="h-[56px] px-7 rounded-[6px] bg-[#070b24] text-white flex items-center gap-5 hover:bg-[#4f5dff]">
              <span class="text-[16px] font-medium">Download Now</span>
              <span class="w-px h-6 bg-white/30"></span>
              <span class="text-[24px]"></span>
            </a>

            <!-- Watch Demo -->
            <a href="#" class="flex items-center gap-4 text-[#070b24] hover:text-[#4f5dff]">
              <span class="w-[54px] h-[54px] rounded-full border-2 border-[#070b24] flex items-center justify-center">
                ▶
              </span>

              <span class="leading-tight text-left">
                <span class="block text-[15px] font-semibold">Watch Demo</span>
                <span class="block text-[15px] font-semibold mt-2">See how it works</span>
              </span>
            </a>

          </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="relative h-[460px] flex items-center justify-center">

          <!-- Purple circle -->
          <div class="absolute w-[360px] h-[360px] rounded-full bg-[#aab1ff]"></div>

          <!-- Stars -->
          <div class="absolute top-[45px] right-[55px] text-[#6f7cff] text-[34px] z-20">✦</div>
          <div class="absolute top-[83px] right-[25px] text-[#44d8d2] text-[22px] z-20">✦</div>

          <!-- Waves -->
          <div class="absolute left-[20px] bottom-[105px] text-[#ff6b8a] text-[26px] leading-[12px] z-20">
            <div>~~~~</div>
            <div>~~~~</div>
            <div>~~~~</div>
          </div>

          <!-- Phone image -->
          <img
            src="assets/hero-light.png"
            alt="App phone mockup"
            class="relative z-10 w-[300px] object-contain"
          />

        </div>

      </div>
    </section>
  </main>

</body>
</html>
